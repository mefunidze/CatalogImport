name: catalog-import
x-app: &app
  build: .
  volumes:
    - .:/app
    - vendor:/app/vendor
  environment:
    DB_HOST: db
    DB_PORT: 3306
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: catalog
      MYSQL_USER: catalog
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h127.0.0.1 -uroot -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8000"
    command: ["sh", "-c", "composer install --no-interaction --prefer-dist --no-progress && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s
  worker:
    <<: *app
    depends_on:
      app:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=60"]
    restart: unless-stopped
    stop_grace_period: 70s

volumes:
  mysql:
  vendor:
